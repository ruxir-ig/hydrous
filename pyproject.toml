[project]
name = "hydrous"
version = "0.1.0"
description = "mem0-compatible agent memory layer: append-only bi-temporal facts, abstention, graph retrieval — one engine instead of Qdrant+Neo4j+Postgres glue"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["memory", "agent", "mem0", "llm", "bi-temporal", "rag", "longmemeval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
hydra = ["hydradb-sdk>=2,<3"]

[project.scripts]
hydrous = "hydrous.cli:app"
hydra-mem = "hydra_mem.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrous", "src/hydra_mem"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# CPU-only torch wheels on Linux x86_64 (avoids multi-GB CUDA deps from PyPI).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/hydrous/cli.py" = ["B008"]        # typer.Option(...) defaults are the typer idiom
"src/hydra_mem/cli.py" = ["B008"]      # typer.Option(...) defaults are the typer idiom
"src/hydrous/eval/judge.py" = ["E501"] # official judge prompts are verbatim single-line strings
