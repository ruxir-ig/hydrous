[project]
name = "hydra-mem"
version = "0.1.0"
description = "HydraMem: agent memory layer for cross-session continuity (Hack with Hydra)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
hydra = ["hydradb-sdk>=2,<3"]

[project.scripts]
hydra-mem = "hydra_mem.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydra_mem"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# CPU-only torch wheels on Linux x86_64 (avoids multi-GB CUDA deps from PyPI).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/hydra_mem/cli.py" = ["B008"]        # typer.Option(...) defaults are the typer idiom
"src/hydra_mem/eval/judge.py" = ["E501"] # official judge prompts are verbatim single-line strings
